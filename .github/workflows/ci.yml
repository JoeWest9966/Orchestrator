name: Orchestrator CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt

      # ADR-0003：farm-sdk 的唯一来源是钉住 rev 的 git 依赖。crates.io 上没有这个 SDK，
      # 也不能退化成 path 依赖。path 依赖的 `source` 是 `null`、registry 依赖以
      # `registry+` 开头——下面两条断言把它们都拒掉。
      - name: Assert farm-sdk comes from git (not a path or registry dependency)
        run: |
          cargo metadata --format-version 1 --locked |
            jq -e '
              .packages[]
              | select(.name == "farm-sdk")
              | .source
              | select(. != null)
              | startswith("git+https://github.com/JoeWest9966/Farm")
            ' > /dev/null

      - name: Assert farm-sdk is pinned to the exact rev
        run: |
          cargo metadata --format-version 1 --locked |
            jq -r '.packages[] | select(.name == "farm-sdk") | .source' |
            grep -F 'rev=ec5fd3a869147d28366f74dbd07ed869574be914'

      # §4.2：契约主版本被钉住——编译期常量 1 + 运行时握手核对该主版本。
      # 不用 `--exact`：完整测试路径一旦改动，`--exact` 会静默选中 0 个测试
      # （exit 0），断言形同虚设。这里用子串匹配，并硬性要求它真的选中了测试。
      - name: Assert the pinned contract major
        run: |
          log=$(CARGO_TARGET_DIR="$PWD/target" cargo test --locked -p orchestrator --lib -- contract_major 2>&1)
          printf '%s\n' "$log"
          if printf '%s\n' "$log" | grep -q 'running 0 tests'; then
            echo "FAIL: the pinned-major assertion selected no test — it is vacuous"
            exit 1
          fi

      - name: Build
        run: CARGO_TARGET_DIR="$PWD/target" cargo build --locked --all-targets

      # 单测（lib）。两条演练（tests/dispatch_sequence.rs / tests/main_loop_e2e.rs）需要**真的**
      # farm-host 与 fake-pi，二进制不到场时它们**失败**（不是跳过）——所以演练归下面的
      # `drills` job，这里不跑（那边跑全套：`cargo test --locked`）。
      - name: Test (unit tests)
        run: CARGO_TARGET_DIR="$PWD/target" cargo test --locked --lib

      - name: Clippy (deny warnings)
        run: CARGO_TARGET_DIR="$PWD/target" cargo clippy --locked --all-targets -- -D warnings

      - name: Fmt check
        run: CARGO_TARGET_DIR="$PWD/target" cargo fmt --check

  # 两条演练是票 #4 / #5 的验收标准，而它们要真的宿主与替身（替身住在 JoeWest9966/Farm 的
  # 钉住 rev 上，本仓的 target 里没有）。二进制不到场时演练会**失败**（不是跳过：零断言的绿
  # 不是绿），所以演练只有这一个出处。
  drills:
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0

      # 宿主与替身：与 Cargo.toml 里 farm-sdk 的 rev 钉在一起（同一枚 rev）。
      - name: Check out Farm (the host + the fake agent, pinned rev)
        uses: actions/checkout@v4
        with:
          repository: JoeWest9966/Farm
          ref: ec5fd3a869147d28366f74dbd07ed869574be914
          path: farm

      - name: Build farm-host and the fakes
        working-directory: farm
        run: CARGO_TARGET_DIR="$PWD/target" cargo build --locked -p farm-host -p farm-core --bins

      # `FARM_HOST_BIN` / `FAKE_PI_BIN` 显式给：它们不到场时演练会失败，而不是静默零断言通过。
      - name: Test (unit + the e2e drills against a real farm-host)
        env:
          FARM_HOST_BIN: ${{ github.workspace }}/farm/target/debug/farm-host
          FAKE_PI_BIN: ${{ github.workspace }}/farm/target/debug/fake-pi
        run: CARGO_TARGET_DIR="$PWD/target" cargo test --locked
